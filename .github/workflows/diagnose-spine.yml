name: Diagnose Spine

# 在 CI 上跑 Spine 导出器的诊断（内存曲线 / 模型规模 / A-B 对比）。
#
# 为什么诊断也放 CI：项目纪律要求本机不运行、不编译。
# 而且重 mesh 模型的 out of memory 在 CI 上同样复现（Linux + 7GB），
# 说明不是本机内存不足，而是要在这里定位。

on:
  workflow_dispatch:
    inputs:
      model:
        description: '模型 key（如 2023_ling）'
        required: true
        type: string
      anim:
        description: '只测一段动画（留空 = 全部）'
        required: false
        default: ''
        type: string
      scale:
        description: '缩放'
        required: false
        default: '0.5'
        type: string
      fps:
        description: '帧率'
        required: false
        default: '8'
        type: string
      probe:
        description: '每 N 帧打印一次内存（1 = 每帧）'
        required: false
        default: '1'
        type: string
      images_only:
        description: 'A/B：关掉三角形渲染（只画 region，所有 mesh 被跳过）'
        required: false
        default: false
        type: boolean

concurrency:
  group: diagnose-spine
  cancel-in-progress: false

jobs:
  probe:
    name: 内存曲线诊断
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 系统图形库 + 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          node -e "require('canvas'); console.log('node-canvas 就绪')"

      - name: 报告运行环境
        run: |
          echo "node: $(node -v)"
          echo "cairo: $(pkg-config --modversion cairo)"
          echo "内存: $(free -m | awk '/Mem:/{print $2" MB total"}')"
          echo "CPU: $(nproc) 核"

      - name: 下载模型
        env:
          MK: ${{ inputs.model }}
        run: |
          set -e
          mkdir -p _ark models
          curl -fsSL https://raw.githubusercontent.com/isHarryh/Ark-Models/main/models_data.json -o _ark/models_data.json
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('_ark/models_data.json', 'utf8'));
            const k = process.env.MK;
            const e = m.data[k];
            if (!e) {
              const near = Object.keys(m.data).filter((x) => x.startsWith(k)).slice(0, 5);
              console.error('索引里没有 ' + k + '，相近的有: ' + near.join(', '));
              process.exit(1);
            }
            console.log(k + ' => ' + e.name + ' / ' + e.appellation);
            fs.mkdirSync('models/' + k, { recursive: true });
            for (const f of Object.values(e.assetList)) {
              const url = 'https://raw.githubusercontent.com/isHarryh/Ark-Models/main/models/' + encodeURIComponent(k) + '/' + encodeURIComponent(f);
              console.log('  下载 ' + f);
              require('child_process').execFileSync('curl', ['-fsSL', '-o', 'models/' + k + '/' + f, url], { stdio: 'inherit' });
            }
          "

      - name: 模型规模（mesh 数 / 贴图 / 约束）
        run: node tools/spine_diag.mjs --model models/${{ inputs.model }} || true

      - name: 内存曲线（关键：判别累积 vs 尖峰）
        env:
          MODEL: ${{ inputs.model }}
          ANIM: ${{ inputs.anim }}
          SCALE: ${{ inputs.scale }}
          FPS: ${{ inputs.fps }}
          PROBE: ${{ inputs.probe }}
          IMGONLY: ${{ inputs.images_only }}
        run: |
          set -e
          # --geo-probe 每次 toBuffer 前检查几何：非有限值 + 最大量级。
          # cairo 对非有限/超大坐标都会抛 out of memory，必须先排除这类输入问题。
          ARGS="--model models/$MODEL --out _diag --scale $SCALE --fps $FPS --mem-probe $PROBE --geo-probe 1 --png-probe 1"
          [ -n "$ANIM" ] && ARGS="$ARGS --anim $ANIM"
          [ "$IMGONLY" = "true" ] && { ARGS="$ARGS --images-only"; echo '::warning::images-only 模式：所有 mesh 被跳过'; }
          echo "运行: node tools/spine_export.mjs $ARGS"
          node tools/spine_export.mjs $ARGS 2>&1 | tee probe.log || true
          echo '--- MEM 采样 ---'
          grep 'MEM ' probe.log || echo '(无 MEM 输出)'
          echo '--- GEO 采样（几何：非有限值与量级）---'
          grep 'GEO ' probe.log || echo '(无 GEO 输出)'
          echo '--- 结果 ---'
          grep -E '帧 @|失败' probe.log || true

      - name: PNG 自检（自写编码器的产物必须能被反解）
        # 导出器绕开了 cairo 的 PNG 编码器自己封 PNG，所以必须独立验证：
        # 能反解、尺寸一致、且不是全透明。否则问题会一路漏到运行时（画面空白）。
        if: always()
        run: |
          if [ -d _diag/frames ]; then
            node tools/verify_png.mjs _diag/frames
          else
            echo "(没有 _diag/frames，跳过)"
          fi

      - name: 判定（复现 OOM 就红）
        run: |
          if grep -q 'out of memory' probe.log; then
            LAST=$(grep 'MEM ' probe.log | tail -1)
            echo "::error::复现 out of memory。最后一个内存采样: $LAST"
            exit 1
          fi
          echo '未复现 out of memory'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnose-${{ inputs.model }}-${{ inputs.anim || 'all' }}
          path: probe.log
          if-no-files-found: warn
