<!doctype html>
<html><head><meta charset="utf-8"><title>spine-webgl 离屏烘焙</title></head>
<body style="margin:0;background:#000">
<canvas id="c" width="16" height="16" style="display:block"></canvas>

<script>
// spine-webgl 运行时由宿主（Electron）注入到 window.__SPINE__。
// 这个页面不用 type=module：vendor 运行时是全局 var spine 的 UMD 风格，
// 用 module 会拿不到它。

(function () {
  var logs = [];
  function log() {
    var s = Array.prototype.map.call(arguments, function (x) {
      return typeof x === 'string' ? x : JSON.stringify(x);
    }).join(' ');
    logs.push(s);
    if (logs.length > 20) logs.shift();
    console.log('[bake] ' + s);
  }
  window.__logs = logs;
  window.addEventListener('error', function (e) { log('ERROR ' + e.message); });
  window.addEventListener('unhandledrejection', function (e) {
    log('REJECT ' + String((e.reason && e.reason.message) || e.reason));
  });

  window.__bake = async function (job) {
    var ctx = window.__CTX;
    if (!ctx) throw new Error('必须先调用 __prepare（上下文与纹理只建一次）');
    var spine = ctx.spine;
    var canvas = ctx.canvas;
    var context = ctx.context;
    var renderer = ctx.renderer;
    var data = ctx.data;
    canvas.width = job.canvasW;
    canvas.height = job.canvasH;

    var skeleton = new spine.Skeleton(data);
    if (data.skins && data.skins.length) {
      skeleton.setSkin(data.skins.find(function (s) { return s.name === 'default'; }) || data.skins[0]);
      skeleton.setToSetupPose();
    }

    // 统计 clipping 附件（spine-canvas 不支持它，这是走 WebGL 的理由）
    var clipping = 0, mesh = 0;
    (data.skins || []).forEach(function (sk) {
      var list = [];
      try { list = sk.getAttachments() || []; } catch (e) { list = []; }
      list.forEach(function (e) {
        var a = e && e.attachment;
        if (!a) return;
        var cn = (a.constructor && a.constructor.name) || '';
        if (cn === 'ClippingAttachment') clipping++;
        else if (cn === 'MeshAttachment') mesh++;
      });
    });
    log('附件统计 mesh=' + mesh + ' clipping=' + clipping);

    var sd = new spine.AnimationStateData(data);
    sd.defaultMix = 0;
    var state = new spine.AnimationState(sd);
    state.setAnimation(0, job.name, true);

    var glc = context.gl;
    var frames = [];
    var dt = 1 / job.fps;
    for (var i = 0; i < job.total; i++) {
      skeleton.setToSetupPose();
      state.apply(skeleton);
      // 与 canvas 路径同一套变换：缩放 + 按包围盒平移。
      // Y 轴取负 —— Spine 的 Y 向上、PNG 的 Y 向下。
      skeleton.x = -job.bounds.minX * job.scale;
      skeleton.y = job.bounds.maxY * job.scale;
      skeleton.scaleX = job.scale;
      skeleton.scaleY = -job.scale;
      skeleton.updateWorldTransform();

      renderer.camera.position.x = job.canvasW / 2;
      renderer.camera.position.y = job.canvasH / 2;
      renderer.camera.viewportWidth = job.canvasW;
      renderer.camera.viewportHeight = job.canvasH;
      renderer.camera.zoom = 1;
      // Spine 的 ortho 相机 Y 向上：把画布中心作为原点，所以骨架要平移 -H/2
      renderer.camera.update();

      glc.viewport(0, 0, job.canvasW, job.canvasH);
      glc.clearColor(0, 0, 0, 0);
      glc.clear(glc.COLOR_BUFFER_BIT | glc.STENCIL_BUFFER_BIT);
      renderer.begin();
      renderer.drawSkeleton(skeleton, true);
      renderer.end();

      var px = new Uint8Array(job.canvasW * job.canvasH * 4);
      glc.readPixels(0, 0, job.canvasW, job.canvasH, glc.RGBA, glc.UNSIGNED_BYTE, px);
      frames.push(px);

      state.update(dt);
    }
    return { frames: frames, width: job.canvasW, height: job.canvasH, clipping: clipping, mesh: mesh };
  };

  // 从 dataURL 建 GL 纹理。TextureAtlas 内部会对返回的对象调
  // setFilters()/setWraps()，所以**必须**返回真的 GLTexture ——
  // 返回 null 会报 'Cannot read properties of null (reading setFilters)'
  // （实测踩到，而且因为探针也叫 TextureAtlas，害我误判了一轮）。
  async function makeTextures(spine, context, pngByPage) {
    var textures = {};
    var pages = Object.keys(pngByPage || {});
    for (var i = 0; i < pages.length; i++) {
      var page = pages[i];
      var img = await new Promise(function (res, rej) {
        var im = new Image();
        im.onload = function () { res(im); };
        im.onerror = function () { rej(new Error('贴图解码失败 ' + page)); };
        im.src = pngByPage[page];
      });
      textures[page] = new spine.webgl.GLTexture(context, img, false);
    }
    return textures;
  }

  function buildData(spine, skelB64, atlasText, textures) {
    var loader = new spine.AtlasAttachmentLoader(new spine.TextureAtlas(atlasText, function (path) {
      return textures[path] || textures[path.split('/').pop()];
    }));
    var bin = Uint8Array.from(atob(skelB64), function (c) { return c.charCodeAt(0); });
    return new spine.SkeletonBinary(loader).readSkeletonData(bin);
  }

  // 宿主调用：一次建立上下文 + 纹理，然后跑 probe/animInfo/bake，避免重复开销。
  window.__prepare = async function (job) {
    var spine = window.__SPINE__;
    var canvas = document.getElementById('c');
    canvas.width = job.canvasW;
    canvas.height = job.canvasH;
    var context = new spine.webgl.ManagedWebGLRenderingContext(canvas, {
      alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: false,
    });
    var textures = await makeTextures(spine, context, job.pngByPage);
    var data = buildData(spine, job.skelB64, job.atlasText, textures);
    var renderer = new spine.webgl.SceneRenderer(canvas, context, false);
    window.__CTX = { spine: spine, canvas: canvas, context: context, data: data, renderer: renderer };
    return {
      version: data.version,
      anims: data.animations.map(function (a) { return a.name; }),
    };
  };

  // 取某段动画的时长与「整段动画的包围盒」——包围盒必须逐帧扫，
  // 不能只看 setup pose（角色抬手/跳跃时 bbox 会超出 setup pose 很多，
  // 只看 setup pose 会把动作裁掉）。与 canvas 路径的 scanBounds 同口径。
  window.__animInfo = function (animName, fps) {
    var ctx = window.__CTX;
    if (!ctx) throw new Error('必须先调用 __prepare');
    var spine = ctx.spine;
    var data = ctx.data;
    var useFps = fps || 8;
    var anim = data.animations.find(function (a) { return a.name === animName; }) || data.animations[0];
    var duration = anim.duration;
    var total = Math.max(1, Math.round(duration * useFps));
    var skeleton = new spine.Skeleton(data);
    if (data.skins && data.skins.length) {
      skeleton.setSkin(data.skins.find(function (s) { return s.name === 'default'; }) || data.skins[0]);
      skeleton.setToSetupPose();
    }
    var sd = new spine.AnimationStateData(data);
    sd.defaultMix = 0;
    var st = new spine.AnimationState(sd);
    st.setAnimation(0, animName, true);
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    function consider(x, y) {
      if (!isFinite(x) || !isFinite(y)) return;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
    for (var f = 0; f < total; f++) {
      skeleton.setToSetupPose();
      st.apply(skeleton);
      skeleton.updateWorldTransform();
      for (var si = 0; si < skeleton.slots.length; si++) {
        var slot = skeleton.slots[si];
        var att = slot.getAttachment();
        if (!att) continue;
        var cn = (att.constructor && att.constructor.name) || '';
        if (cn === 'ClippingAttachment' || cn === 'BoundingBoxAttachment' || cn === 'PathAttachment' || cn === 'PointAttachment') continue;
        if (typeof att.computeWorldVertices === 'function') {
          var n = att.worldVerticesLength || (att.vertices ? att.vertices.length : 0);
          if (n > 0) {
            var tmp = new Float32Array(n);
            try {
              att.computeWorldVertices(slot, 0, n, tmp, 0, 2);
              for (var q = 0; q + 1 < n; q += 2) consider(tmp[q], tmp[q + 1]);
            } catch (e) { /* 某些附件形态不兼容，跳过 */ }
          }
        }
      }
      st.update(1 / useFps);
    }
    if (!isFinite(minX)) { minX = 0; minY = 0; maxX = 100; maxY = 100; }
    return { duration: duration, total: total,
      bounds: { minX: minX, minY: minY, maxX: maxX, maxY: maxY } };
  };

  window.__ready = true;
})();
</script>
</body></html>
